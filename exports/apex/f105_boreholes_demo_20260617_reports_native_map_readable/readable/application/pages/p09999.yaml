processes: 
- # ====== Process: Demo User Login ============================
  id: 1050500001
  identification: 
    name: Demo User Login
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      
      begin
        if apex_application.g_request = 'DEMO_USER_LOGIN' then
          apex_authentication.post_login(
            p_username           => 'DEMO_USER',
            p_password           => 'DEMO',
            p_uppercase_username => true
          );
      
          apex_util.redirect_url(apex_page.get_url(p_page => 1));
          apex_application.stop_apex_engine;
        end if;
      end;
      

  execution: 
    sequence: 1
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request = Value
    value: DEMO_USER_LOGIN

